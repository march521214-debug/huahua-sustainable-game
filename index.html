function animatePolish(t){for(const p of motionProps){if(p.type==='cloud')p.o.position.x=p.base+Math.sin(t*.13)*.7;if(p.type==='person')p.o.rotation.y=Math.sin(t*.6+p.o.position.x)*.08;if(p.type==='conveyor')p.o.position.x=p.base+((t*.38)%1.5);if(p.type==='steam'){p.o.position.y=p.base+Math.sin(t*1.6+p.phase)*.13;p.o.material.opacity=.15+.09*(1+Math.sin(t*1.5+p.phase))}}}

const marketAnimated=[];
function marketMaterial(color,roughness=.78){return new THREE.MeshStandardMaterial({color,roughness,metalness:0})}
function marketMesh(geometry,material,x,y,z,parent=scene){const o=new THREE.Mesh(geometry,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function marketBox(x,y,z,w,h,d,color,parent=scene){return marketMesh(new THREE.BoxGeometry(w,h,d),marketMaterial(color),x,y,z,parent)}
function marketSphere(x,y,z,r,color,parent=scene){return marketMesh(new THREE.SphereGeometry(r,18,12),marketMaterial(color),x,y,z,parent)}
function marketCylinder(x,y,z,rt,rb,h,color,parent=scene){return marketMesh(new THREE.CylinderGeometry(rt,rb,h,16),marketMaterial(color),x,y,z,parent)}
function marketText(text,x,y,z,width=3,fg='#fff9e9',bg='#477754'){
 const c=document.createElement('canvas');c.width=768;c.height=192;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,768,192);g.strokeStyle='#e8c78b';g.lineWidth=14;g.strokeRect(9,9,750,174);g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.font='bold 74px Microsoft JhengHei, sans-serif';g.fillText(text,384,98);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return marketMesh(new THREE.PlaneGeometry(width,width/4),new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide}),x,y,z)
}

 for(const side of [-1,1]){const a=sph(side*.44,1.03,0,.145,.38,.15,cloth);a.rotation.z=side*.22;sph(side*.55,.72,-.02,.12,.14,.13,skin)}
 sph(0,1.72,0,.33,.36,.31,skin);sph(0,1.97,.06,.34,.16,.31,hair);
 for(const side of [-1,1]){sph(side*.14,1.75,-.287,.042,.055,.022,M(0x322a26));sph(side*.14,1.77,-.305,.012,.014,.008,M(0xffffff));sph(side*.24,1.65,-.24,.07,.05,.045,M(0xf0a69a))}
 sph(0,1.63,-.322,.085,.023,.012,M(0x9b544d));
  if(hat){cyl(0,2.1,0,.48,.48,.09,M(0xe4bd7a));cyl(0,2.25,0,.28,.34,.25,M(0xc48b53));cyl(0,2.16,0,.3,.3,.05,M(0x6c9b67))}

    sph(-.29,1.71,.045,.095,.24,.19,hair);sph(.29,1.71,.045,.095,.24,.19,hair);

 return g;
